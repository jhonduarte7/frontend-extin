name: Frontend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build & Verify Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -d "frontend-extin" ]; then
            cd frontend-extin && npm install
          fi

      - name: Build Vite application
        run: |
          if [ -f "package.json" ]; then
            npm run build
          elif [ -d "frontend-extin" ]; then
            cd frontend-extin && npm run build
          fi
